host: "0.0.0.0"
port: 8317
auth-dir: "/tmp/cpa-provider-nexus-oauth-auths"
api-keys:
  - "cpa-provider-nexus-oauth-api-key"
remote-management:
  allow-remote: true
  secret-key: "cpa-provider-nexus-oauth-management-key"
  disable-control-panel: false
plugins:
  enabled: true
  dir: "/plugins"
  configs:
    cpa-provider-nexus:
      enabled: true
      priority: 100
      login_mode: kiro-browser
      browser_redirect_uri: "http://localhost:3128"
      desktop_token_url: "http://kiro-mock:18080/oauth/token"
      api_region: "eu-west-1"
