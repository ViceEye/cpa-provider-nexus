host: "0.0.0.0"
port: 8317
auth-dir: "/tmp/cpa-provider-nexus-auths"
api-keys:
  - "cpa-provider-nexus-integration-key"
remote-management:
  allow-remote: true
  secret-key: "cpa-provider-nexus-integration-management-key"
  disable-control-panel: true
debug: false
plugins:
  enabled: true
  dir: "/plugins"
  configs:
    cpa-provider-nexus:
      enabled: true
      priority: 100
      import_mode: reference
      login_mode: kiro-browser
      browser_redirect_uri: "http://localhost:3128"
      desktop_token_url: "http://kiro-mock:18080/oauth/token"
      runtime_base_url: "http://kiro-mock:18080"
      model_discovery_url: "http://kiro-mock:18080"
      usage_url: "http://kiro-mock:18080"
      desktop_refresh_url: "http://kiro-mock:18080/refreshToken"
