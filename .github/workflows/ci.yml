name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v<version> tag to package and publish
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        id: version
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$(sed -n 's/.*pluginVersion = "\([^"]*\)".*/\1/p' internal/provider/types.go)"
          test -n "$version"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          release_tag="$REQUESTED_RELEASE_TAG"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$release_tag" && "$release_tag" != "v$version" ]]; then
            echo "release tag $release_tag does not match plugin version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Check formatting
        run: test -z "$(gofmt -l cmd/cpa-provider-nexus/*.go internal/*/*.go)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./internal/... ./cmd/...

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: so
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            ext: so
          - os: darwin
            arch: amd64
            runner: macos-latest
            ext: dylib
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: dylib
          - os: windows
            arch: amd64
            runner: ubuntu-latest
            ext: dll
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cross compilers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 zip

      - name: Build plugin
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist/package
          if [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -buildmode=c-shared \
              -o "dist/package/cpa-provider-nexus.${EXT}" ./cmd/cpa-provider-nexus
          elif [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -buildmode=c-shared \
              -o "dist/package/cpa-provider-nexus.${EXT}" ./cmd/cpa-provider-nexus
          elif [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -buildmode=c-shared \
              -o "dist/package/cpa-provider-nexus.${EXT}" ./cmd/cpa-provider-nexus
          elif [ "${{ matrix.os }}" = "darwin" ]; then
            CGO_ENABLED=1 GOOS=darwin GOARCH="${{ matrix.arch }}" go build -trimpath -ldflags="-s -w" -buildmode=c-shared \
              -o "dist/package/cpa-provider-nexus.${EXT}" ./cmd/cpa-provider-nexus
          fi
          rm -f dist/package/*.h
          test -s "dist/package/cpa-provider-nexus.${EXT}"

      - name: Package zip archive
        env:
          VERSION: ${{ needs.test.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist/release
          archive="cpa-provider-nexus_${VERSION}_${OS}_${ARCH}.zip"
          (cd dist/package && zip -9 "../../dist/release/${archive}" "cpa-provider-nexus.${EXT}")
          test "$(unzip -Z1 "dist/release/${archive}")" = "cpa-provider-nexus.${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [test, build]
    if: needs.test.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: asset-*
          merge-multiple: true

      - name: Generate and verify checksums
        working-directory: dist/release
        run: |
          ls -la
          test $(ls -1 cpa-provider-nexus_*_*.zip | wc -l) -eq 5
          sha256sum cpa-provider-nexus_*_*.zip > checksums.txt
          cat checksums.txt
          sha256sum -c checksums.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.test.outputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
